<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Archly</title>
<!-- Cache-busting: bump the ?v= on every deploy (index.html itself, css/styles.css,
     and every js/*.js below) so returning visitors' browsers fetch the new files
     instead of serving stale cached ones. See js/patterns.js's ASSET_VERSION for
     the matching bump on the patterns/*.yaml fetches. -->
<link rel="stylesheet" href="css/styles.css?v=42" />
</head>
<body>
  <div class="app">
    <div class="body">
      <main class="canvas-wrap" id="canvas-wrap">
        <div class="ruler-corner"></div>
        <div class="ruler-h" id="ruler-h"></div>
        <div class="ruler-v" id="ruler-v"></div>
        <div id="empty-state" class="empty-state" style="display:none">
          <div class="empty-state-card">
            <p class="empty-state-title">Your canvas is empty</p>
            <p class="empty-state-body">Click &#9776; to add a component, start a blank canvas, or pick a pattern:</p>
            <div class="empty-state-actions">
              <button id="btn-empty-new" class="btn btn-accent">&#43; New Empty Canvas</button>
            </div>
            <div class="empty-state-patterns" id="empty-state-patterns"></div>
          </div>
        </div>
        <div class="canvas-scroll" id="canvas-scroll">
          <svg id="canvas" width="20000" height="20000" viewBox="0 0 20000 20000" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse">
                <path d="M0,0 L10,5 L0,10 z" class="arrowhead-path"></path>
              </marker>
            </defs>
            <g id="layer-containers"></g>
            <g id="layer-edges"></g>
            <g id="layer-nodes"></g>
            <g id="layer-sim" class="no-export"></g>
            <g id="layer-overlay" class="no-export"></g>
          </svg>
        </div>
      </main>

      <!-- Brand corner: pure identity, never part of the toolbar's button
           row and never moves when the toolbar flips edges (#btn-bar-position)
           — see .brand-corner in styles.css. Not interactive. -->
      <div class="brand-corner" id="brand-corner" title="Archly">
        <span class="brand-mark">&#9635;</span>
        <span class="brand-name">Archly</span>
      </div>

      <!-- One consolidated floating toolbar (Excalidraw-style: the canvas
           above is always full-bleed, this overlays it) — flips between
           top/bottom via #btn-bar-position; see body[data-toolbar-pos] in
           styles.css. Rare actions live behind the kebab (#btn-more); the
           component palette and pattern library are icon-triggered flyouts
           (hamburger / bento) instead of always-open drawers. Kept to a
           single non-wrapping row — see flex-wrap:nowrap on .toolbar-bar. -->
      <header class="toolbar-bar" id="toolbar-bar">
        <button id="btn-new" class="btn btn-iconlabel" aria-label="New empty canvas"><span class="btn-icon-glyph">&#43;</span><span class="btn-label">New</span></button>
        <span class="tb-sep"></span>
        <button id="btn-palette-toggle" class="btn btn-iconlabel" aria-label="Components"><span class="btn-icon-glyph">&#9776;</span><span class="btn-label">Components</span></button>
        <button id="btn-pattern" class="btn btn-iconlabel" aria-label="Patterns"><span class="btn-icon-glyph">&#9638;</span><span class="btn-label">Patterns</span></button>

        <span class="tb-sep"></span>
        <button id="btn-undo" class="btn btn-iconlabel tb-mobile-hide" aria-label="Undo (Ctrl/Cmd+Z)" disabled><span class="btn-icon-glyph">&#8630;</span><span class="btn-label">Undo</span></button>
        <button id="btn-redo" class="btn btn-iconlabel tb-mobile-hide" aria-label="Redo (Ctrl/Cmd+Shift+Z)" disabled><span class="btn-icon-glyph">&#8631;</span><span class="btn-label">Redo</span></button>

        <span class="tb-sep tb-sep-mobile-hide"></span>
        <button id="btn-play" class="btn btn-accent btn-iconlabel" aria-label="Animate the request flow in arrow order"><span class="btn-icon-glyph">&#9654;</span><span class="btn-label">Play</span></button>
        <button id="btn-pause" class="btn btn-iconlabel" aria-label="Pause after the current step"><span class="btn-icon-glyph">&#10074;&#10074;</span><span class="btn-label">Pause</span></button>
        <button id="btn-reset" class="btn btn-iconlabel tb-mobile-hide" aria-label="Reset the flow animation"><span class="btn-icon-glyph">&#8634;</span><span class="btn-label">Reset</span></button>
        <label class="tb-group tb-mobile-hide" aria-label="Playback speed">
          <span class="btn-icon-glyph">&#9201;</span>
          <select id="speed-select" class="select">
            <option value="1600">Slow</option>
            <option value="900" selected>Normal</option>
            <option value="450">Fast</option>
          </select>
          <span class="btn-label">Speed</span>
        </label>

        <span class="tb-sep"></span>
        <button id="btn-view" class="btn btn-iconlabel tb-mobile-hide" aria-label="Toggle grid background, rulers, and simulation"><span class="btn-icon-glyph">&#9744;</span><span class="btn-label">View</span></button>
        <button id="btn-edit" class="btn btn-iconlabel tb-mobile-hide" aria-label="Edit the current selection (also available by right-click)" disabled><span class="btn-icon-glyph">&#9998;</span><span class="btn-label">Edit</span></button>
        <button id="btn-results-toggle" class="btn btn-iconlabel" aria-label="Simulation results"><span class="btn-icon-glyph">&#9636;</span><span class="btn-label">Results</span></button>

        <span class="tb-sep"></span>
        <button id="btn-more" class="btn btn-iconlabel" aria-label="More: clear, export/import, help"><span class="btn-icon-glyph">&#8942;</span><span class="btn-label">More</span></button>
        <button id="btn-bar-position" class="btn btn-iconlabel" aria-label="Move toolbar to bottom"><span class="btn-icon-glyph">&#8645;</span><span class="btn-label" id="bar-position-label">Bottom</span></button>
      </header>

      <!-- Zoom/Fit: a separate minimal floating strip, deliberately outside
           the toolbar row and pinned to the bottom-left corner regardless of
           where the main toolbar is docked — see .tb-zoom position rules. -->
      <div class="tb-zoom">
        <button id="btn-zoom-out" class="btn btn-icon" title="Zoom out (Ctrl/Cmd+scroll)">&#8722;</button>
        <button id="zoom-label" class="btn btn-zoom-label" title="Reset zoom to 100%">100%</button>
        <button id="btn-zoom-in" class="btn btn-icon" title="Zoom in (Ctrl/Cmd+scroll)">&#43;</button>
        <button id="btn-zoom-fit" class="btn" title="Fit the whole diagram in view">Fit</button>
      </div>

      <input type="file" id="import-yaml-input" accept=".yaml,.yml" style="display:none" />
      <input type="file" id="image-upload-input" accept="image/*" style="display:none" />

      <aside class="palette" id="palette">
        <div class="palette-search-wrap">
          <input type="search" id="palette-search" class="palette-search" placeholder="Search components&hellip;" />
        </div>
        <div id="palette-empty" class="palette-empty" style="display:none"></div>
        <!-- category sections populated by app.js from COMPONENTS -->
      </aside>

      <aside class="results-panel" id="results-panel">
        <div class="results-panel-header">Simulation</div>
        <div id="results-panel-content" class="results-panel-content"></div>
      </aside>

      <div class="brand-watermark">SALPE Global Tech &copy; 2026</div>
    </div>
  </div>

  <script src="js/components.js?v=42"></script>
  <script src="js/yaml.js?v=42"></script>
  <script src="js/canvas.js?v=42"></script>
  <script src="js/arrows.js?v=42"></script>
  <script src="js/animate.js?v=42"></script>
  <script src="js/simulate.js?v=42"></script>
  <script src="js/patterns.js?v=42"></script>
  <script src="js/export.js?v=42"></script>
  <script src="js/app.js?v=42"></script>
</body>
</html>
